; esp32c3-clock — desk clock firmware
; Board: ESP32-C3 SuperMini (compatible with esp32-c3-devkitm-1)

[env:supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
monitor_echo = yes

; The SuperMini uses the C3's native USB (no USB-UART chip):
; these flags route Serial through the USB-C port.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    majicdesigns/MD_Parola @ ^3.7.3
    majicdesigns/MD_MAX72XX @ ^3.5.1
    mathertel/OneButton @ ^2.6.1
    tzapu/WiFiManager @ ^2.0.17
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
