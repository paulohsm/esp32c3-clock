<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16110f">
  <title>Relógio</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="icon-btn" hidden aria-label="Voltar">‹</button>
    <h1 id="title">Relógio</h1>
    <span id="connDot" class="dot" title="Desconectado"></span>
    <button id="logoutBtn" class="text-btn" hidden>Sair</button>
  </header>

  <main>
    <!-- Login -->
    <section id="loginView" class="view">
      <form id="loginForm" class="card">
        <h2>Entrar</h2>
        <p class="muted">Use uma credencial do HiveMQ (por exemplo, <code>clock_app</code>).</p>
        <label>Usuário
          <input id="user" autocomplete="username" autocapitalize="off" required>
        </label>
        <label>Senha
          <input id="pass" type="password" autocomplete="current-password" required>
        </label>
        <label class="check">
          <input id="remember" type="checkbox"> Lembrar neste aparelho
        </label>
        <button class="primary" type="submit" id="loginBtn">Conectar</button>
        <p id="loginError" class="error" hidden></p>
      </form>
    </section>

    <!-- Clock list -->
    <section id="listView" class="view" hidden>
      <div id="deviceList" class="list"></div>
      <p id="emptyList" class="muted center">Procurando relógios…</p>
    </section>

    <!-- Clock detail -->
    <section id="deviceView" class="view" hidden>
      <nav class="tabs" role="tablist">
        <button data-tab="msg" class="active">Mensagem</button>
        <button data-tab="sched">Agenda</button>
        <button data-tab="cfg">Ajustes</button>
        <button data-tab="info">Info</button>
      </nav>

      <div id="offlineBanner" class="banner" hidden>Relógio offline: os comandos serão perdidos.</div>

      <!-- Message -->
      <div data-panel="msg" class="panel card">
        <label>Mensagem
          <textarea id="msgText" maxlength="150" rows="3" placeholder="Escreva aqui…"></textarea>
        </label>
        <div class="row">
          <label class="check"><input id="msgBeep" type="checkbox" checked> Bipe</label>
          <label class="inline">Repetir
            <select id="msgRepeat">
              <option>1</option><option>2</option><option>3</option><option>5</option>
            </select>
          </label>
        </div>
        <button id="msgSend" class="primary">Enviar agora</button>
      </div>

      <!-- Schedules -->
      <div data-panel="sched" class="panel" hidden>
        <div id="schedList" class="list"></div>
        <p id="schedEmpty" class="muted center">Nenhum agendamento.</p>

        <form id="schedForm" class="card">
          <h3>Novo agendamento</h3>
          <div class="seg" role="radiogroup">
            <label><input type="radio" name="kind" value="msg" checked> Mensagem</label>
            <label><input type="radio" name="kind" value="alarm"> Alarme</label>
          </div>
          <label>Horário <input id="schedTime" type="time" required></label>
          <label>Texto <input id="schedText" maxlength="60" placeholder="Opcional no alarme"></label>
          <label>Quando
            <select id="schedWhen">
              <option value="next">Uma vez (próximo horário)</option>
              <option value="date">Uma vez, em uma data</option>
              <option value="days">Repetir nos dias…</option>
            </select>
          </label>
          <label id="schedDateWrap" hidden>Data <input id="schedDate" type="date"></label>
          <div id="schedDaysWrap" class="days" hidden></div>
          <label>Som
            <select id="schedTimbre">
              <option value="">Padrão do relógio</option>
            </select>
          </label>
          <button class="primary" type="submit">Agendar</button>
        </form>
      </div>

      <!-- Settings -->
      <div data-panel="cfg" class="panel" hidden>
        <div class="card">
          <h3>Geral</h3>
          <label>Nome <input data-key="name" maxlength="23"></label>
          <label>Brilho <span class="val" data-val="brightness"></span>
            <input data-key="brightness" type="range" min="0" max="6" step="1">
          </label>
          <label class="switch"><input data-key="rotated" type="checkbox"> Tela invertida (180°)</label>
          <label>Ícone da hora
            <select data-key="clockIcon">
              <option value="0">Fração do dia</option>
              <option value="1">Relógio</option>
              <option value="2">Quadrante do dia</option>
            </select>
          </label>
        </div>
        <div class="card">
          <h3>Som</h3>
          <label class="switch"><input data-key="hourlyBeep" type="checkbox"> Bipe a cada hora</label>
          <label>Timbre
            <span class="row">
              <select data-key="timbre" id="cfgTimbre"></select>
              <button type="button" id="testBeep">Ouvir</button>
            </span>
          </label>
          <label>Volume <span class="val" data-val="volume"></span>
            <input data-key="volume" type="range" min="1" max="5" step="1">
          </label>
        </div>
        <div class="card">
          <h3>Modo noite</h3>
          <p class="muted">Brilho mínimo e sem bipe de hora.</p>
          <label class="switch"><input data-key="nightEnabled" type="checkbox"> Automático</label>
          <div class="row">
            <label class="inline">Das <select data-key="nightStart" class="hours"></select></label>
            <label class="inline">às <select data-key="nightEnd" class="hours"></select></label>
          </div>
        </div>
      </div>

      <!-- Info -->
      <div data-panel="info" class="panel" hidden>
        <div class="card">
          <dl id="infoList" class="info"></dl>
        </div>
        <div class="row">
          <button id="syncBtn">Atualizar</button>
          <button id="rebootBtn" class="danger">Reiniciar relógio</button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
</body>
</html>
